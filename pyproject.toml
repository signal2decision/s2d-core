[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "s2d-core"
version = "0.1.0"
description = "Signal2Decision core: the Decision Card format and its honesty rules."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Arshad Abbas" }]
keywords = ["agriculture", "decision support", "AI agents", "crop models", "MCP"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["pydantic>=2.6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
s2d = "s2d.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/s2d"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
